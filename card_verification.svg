<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 114" width="100%" height="114">
  <defs>
    <pattern id="grid_ver" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 0 24 H 24 M 24 0 V 24" fill="none" stroke="#151b23" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background base and grid -->
  <rect width="100%" height="100%" fill="#0b0f17" />
  <rect width="100%" height="100%" fill="url(#grid_ver)" />

  <style>
    .card {
      fill: #0d1117;
      stroke: #21262d;
      stroke-width: 1.5;
    }
    .badge-bg {
      fill: #341a1a;
    }
    .badge-txt {
      font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 11px;
      font-weight: 700;
      fill: #f78166;
      text-anchor: middle;
    }
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 16px;
      font-weight: 600;
      fill: #c9d1d9;
    }
    .desc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 12.5px;
      fill: #8b949e;
    }
  </style>

  <!-- Card container with rounded corners and border -->
  <rect class="card" x="48" y="8" width="704" height="96" rx="6" />

  <!-- Badge: Rust -->
  <rect class="badge-bg" x="68" y="26" width="44" height="20" rx="4" />
  <text class="badge-txt" x="90" y="40">Rust</text>

  <!-- Project Title -->
  <text class="title" x="124" y="41">Formal Verification Pipeline · IITB Trust Lab</text>

  <!-- Description -->
  <text class="desc" x="124" y="64">C-&gt;Rust migration with automated safety proofs. Miri for UB,</text>
  <text class="desc" x="124" y="82">proptest for invariants, Clippy for idiom enforcement.</text>
</svg>
