<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 136" width="100%" height="136">
  <defs>
    <pattern id="grid_exp" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 0 24 H 24 M 24 0 V 24" fill="none" stroke="#151b23" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background base and grid -->
  <rect width="100%" height="100%" fill="#0b0f17" />
  <rect width="100%" height="100%" fill="url(#grid_exp)" />

  <style>
    .section-title {
      font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #5f6672;
      letter-spacing: 1.5px;
    }
    .content-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 14px;
      fill: #8b949e;
    }
    .bold-txt {
      font-weight: 600;
      fill: #c9d1d9;
    }
    .bullet {
      fill: #3fb950;
      font-weight: bold;
    }
  </style>

  <!-- Section Title -->
  <text class="section-title" x="48" y="22">EXPERIENCE</text>

  <!-- Experience items -->
  <text class="content-text" x="48" y="46">
    <!-- Item 1 -->
    <tspan class="bullet" x="48" dy="0">› </tspan>
    <tspan class="bold-txt">SWE Intern</tspan> at IITB Trust Lab (under Prof. Pratik Jawanpuria)
    
    <!-- Item 2 -->
    <tspan class="bullet" x="48" dy="22">› </tspan>
    <tspan class="bold-txt">Summer Fellow</tspan> at ACM Summer School (Symmetric Key Crypto, IIT Hyderabad)
    
    <!-- Item 3 -->
    <tspan class="bullet" x="48" dy="22">› </tspan>
    <tspan class="bold-txt">Summer Fellow</tspan> at ACM Summer School (Hardware Security, IIT Bombay)
    
    <!-- Item 4 -->
    <tspan class="bullet" x="48" dy="22">› </tspan>
    <tspan class="bold-txt">ML Intern</tspan> at GeoAI4Cities Lab (Bhopal)
  </text>
</svg>
