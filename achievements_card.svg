<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 144" width="100%" height="144">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#151b23" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- Background base and grid -->
  <rect width="100%" height="100%" fill="#0b0f17" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <style>
    .section-title {
      font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #5f6672;
      letter-spacing: 1.5px;
    }
    .content-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 14px;
      fill: #8b949e;
    }
    .bold-txt {
      font-weight: 600;
      fill: #c9d1d9;
    }
    .bullet {
      fill: #3fb950;
      font-weight: bold;
    }
  </style>

  <!-- Section Title -->
  <text class="section-title" x="48" y="28">ACHIEVEMENTS</text>

  <!-- Achievements list -->
  <text class="content-text" x="48" y="55">
    <!-- Item 1 -->
    <tspan class="bullet" x="48" dy="0">› </tspan>
    <tspan class="bold-txt">AIR 47</tspan> at SRMC 2026 Prelims by Jane Street
    
    <!-- Item 2 -->
    <tspan class="bullet" x="48" dy="24">› </tspan>
    <tspan class="bold-txt">AIR 476</tspan> at IEEEXtreme 19.0 (Global Rank 1493)
    
    <!-- Item 3 -->
    <tspan class="bullet" x="48" dy="24">› </tspan>
    <tspan class="bold-txt">Finalist</tspan> in Reverse Coding by IIT Madras x IMC Trading
  </text>
</svg>
