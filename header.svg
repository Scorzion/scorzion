<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 336" width="100%" height="336">
  <defs>
    <!-- Background grid pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#151b23" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- Background base and grid -->
  <rect width="100%" height="100%" fill="#0b0f17" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <style>
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor {
      animation: blink 1.1s infinite;
      fill: #58a6ff;
    }
    .title {
      font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 42px;
      font-weight: 600;
      fill: #ffffff;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2.5px;
      fill: #5f6672;
    }
    .summary {
      font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 15px;
      font-weight: 500;
      fill: #e6edf3;
    }
    .metric-val {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 28px;
      font-weight: 700;
    }
    .metric-lbl {
      font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 10px;
      fill: #5f6672;
      letter-spacing: 1.5px;
    }
    .separator {
      stroke: #21262d;
      stroke-width: 1.5;
    }
  </style>

  <!-- Title: Sourav_ -->
  <g transform="translate(48, 80)">
    <text class="title" x="0" y="0">Sourav</text>
    <!-- Blinking vertical block cursor -->
    <rect class="cursor" x="156" y="-36" width="10" height="42" />
  </g>

  <!-- Subtitles -->
  <text class="subtitle" x="48" y="122">SYSTEMS · CRYPTOGRAPHY · COMPETITIVE PROGRAMMING</text>
  
  <text class="summary" x="48" y="167">
    <tspan fill="#3fb950">~</tspan><tspan fill="#5f6672">/</tspan><tspan fill="#e6edf3"> I write code that runs close to metal</tspan>
  </text>

  <!-- Metrics Grid -->
  <!-- Col 1: CGPA -->
  <text class="metric-val" fill="#58a6ff" x="48" y="232">8.15</text>
  <text class="metric-lbl" x="48" y="254">CGPA / 10</text>

  <!-- Divider 1 -->
  <line class="separator" x1="170" y1="210" x2="170" y2="256" />

  <!-- Col 2: IEEEXTREME -->
  <text class="metric-val" fill="#3fb950" x="194" y="232">AIR 476</text>
  <text class="metric-lbl" x="194" y="254">IEEEXTREME</text>

  <!-- Divider 2 -->
  <line class="separator" x1="335" y1="210" x2="335" y2="256" />

  <!-- Col 3: TRUST LAB -->
  <text class="metric-val" fill="#db6d28" x="359" y="232">IITB</text>
  <text class="metric-lbl" x="359" y="254">TRUST LAB</text>

  <!-- Divider 3 -->
  <line class="separator" x1="485" y1="210" x2="485" y2="256" />

  <!-- Col 4: IISERB BATCH -->
  <text class="metric-val" fill="#f78166" x="509" y="232">2028</text>
  <text class="metric-lbl" x="509" y="254">IISERB BATCH</text>
</svg>
