<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 140" width="100%" height="140">
  <defs>
    <pattern id="grid_tech" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 0 24 H 24 M 24 0 V 24" fill="none" stroke="#151b23" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background base and grid -->
  <rect width="100%" height="100%" fill="#0b0f17" />
  <rect width="100%" height="100%" fill="url(#grid_tech)" />

  <style>
    .section-title {
      font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #5f6672;
      letter-spacing: 1.5px;
    }
    .col-title {
      font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .col-lang {
      fill: #58a6ff;
    }
    .col-tools {
      fill: #3fb950;
    }
    .col-focus {
      fill: #f78166;
    }
    .content-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 13.5px;
      fill: #8b949e;
    }
    .bullet {
      font-weight: bold;
    }
    .bullet-lang {
      fill: #58a6ff;
    }
    .bullet-tools {
      fill: #3fb950;
    }
    .bullet-focus {
      fill: #f78166;
    }
  </style>

  <!-- Section Title -->
  <text class="section-title" x="48" y="22">TECH STACK</text>

  <!-- Column 1: Languages -->
  <text class="col-title col-lang" x="48" y="46">LANGUAGES</text>
  <text class="content-text" x="48" y="66"><tspan class="bullet bullet-lang">› </tspan>C++</text>
  <text class="content-text" x="48" y="84"><tspan class="bullet bullet-lang">› </tspan>Rust</text>
  <text class="content-text" x="48" y="102"><tspan class="bullet bullet-lang">› </tspan>Python</text>
  <text class="content-text" x="48" y="120"><tspan class="bullet bullet-lang">› </tspan>Go / C</text>

  <!-- Column 2: Systems & Tools -->
  <text class="col-title col-tools" x="290" y="46">SYSTEMS &amp; TOOLS</text>
  <text class="content-text" x="290" y="66"><tspan class="bullet bullet-tools">› </tspan>Linux &amp; Git</text>
  <text class="content-text" x="290" y="84"><tspan class="bullet bullet-tools">› </tspan>Docker</text>
  <text class="content-text" x="290" y="102"><tspan class="bullet bullet-tools">› </tspan>gRPC &amp; Protobuf</text>
  <text class="content-text" x="290" y="120"><tspan class="bullet bullet-tools">› </tspan>Miri &amp; Proptest</text>

  <!-- Column 3: Focus Areas -->
  <text class="col-title col-focus" x="530" y="46">FOCUS AREAS</text>
  <text class="content-text" x="530" y="66"><tspan class="bullet bullet-focus">› </tspan>Formal Verification</text>
  <text class="content-text" x="530" y="84"><tspan class="bullet bullet-focus">› </tspan>Low-Latency Systems</text>
  <text class="content-text" x="530" y="102"><tspan class="bullet bullet-focus">› </tspan>Cryptanalysis</text>
  <text class="content-text" x="530" y="120"><tspan class="bullet bullet-focus">› </tspan>Machine Learning</text>
</svg>
