<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 114" width="100%" height="114">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#151b23" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- Background base and grid -->
  <rect width="100%" height="100%" fill="#0b0f17" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <style>
    .section-title {
      font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #5f6672;
      letter-spacing: 1.5px;
    }
    .content-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 14px;
      fill: #8b949e;
    }
    .bold-txt {
      font-weight: 600;
      fill: #c9d1d9;
    }
    .bullet {
      fill: #3fb950;
      font-weight: bold;
    }
  </style>

  <!-- Section Title -->
  <text class="section-title" x="48" y="22">COMPETITIVE PROGRAMMING</text>

  <!-- Ratings list -->
  <text class="content-text" x="48" y="46">
    <!-- CF -->
    <tspan class="bullet" x="48" dy="0">› </tspan>
    <tspan class="bold-txt" style="fill: #a0a0a0">Newbie</tspan> at Codeforces (Rating: 1189, Max: 1226)
    
    <!-- CC -->
    <tspan class="bullet" x="48" dy="22">› </tspan>
    <tspan class="bold-txt" style="fill: #3fb950">2 Star</tspan> at CodeChef (Rating: 1417, Max: 1420)
    
    <!-- AC -->
    <tspan class="bullet" x="48" dy="22">› </tspan>
    <tspan class="bold-txt" style="fill: #a0a0a0">Gray</tspan> at AtCoder (Rating: 344, Max: 344)
  </text>
</svg>
